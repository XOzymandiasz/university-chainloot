services:
  db-a:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: chainloot
      POSTGRES_USER: chainloot
      POSTGRES_PASSWORD: chainloot
    volumes:
      - cluster-a-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainloot -d chainloot"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [private]

  db-b:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: chainloot
      POSTGRES_USER: chainloot
      POSTGRES_PASSWORD: chainloot
    volumes:
      - cluster-b-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainloot -d chainloot"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [private]

  db-c:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: chainloot
      POSTGRES_USER: chainloot
      POSTGRES_PASSWORD: chainloot
    volumes:
      - cluster-c-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainloot -d chainloot"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [private]

  node-a:
    image: university-chainloot-backend:local-cluster
    pull_policy: never
    environment:
      ConnectionStrings__Postgres: Host=db-a;Port=5432;Database=chainloot;Username=chainloot;Password=chainloot
      Cluster__Enabled: "true"
      Cluster__NodeId: a
      Cluster__Peers: a=http://node-a:5000,b=http://node-b:5000,c=http://node-c:5000
      Cluster__AllowTestControls: "true"
      Logging__LogLevel__Default: Warning
    depends_on:
      db-a:
        condition: service_healthy
    networks: [private]

  node-b:
    image: university-chainloot-backend:local-cluster
    pull_policy: never
    environment:
      ConnectionStrings__Postgres: Host=db-b;Port=5432;Database=chainloot;Username=chainloot;Password=chainloot
      Cluster__Enabled: "true"
      Cluster__NodeId: b
      Cluster__Peers: a=http://node-a:5000,b=http://node-b:5000,c=http://node-c:5000
      Cluster__AllowTestControls: "true"
      Logging__LogLevel__Default: Warning
    depends_on:
      db-b:
        condition: service_healthy
    networks: [private]

  node-c:
    image: university-chainloot-backend:local-cluster
    pull_policy: never
    environment:
      ConnectionStrings__Postgres: Host=db-c;Port=5432;Database=chainloot;Username=chainloot;Password=chainloot
      Cluster__Enabled: "true"
      Cluster__NodeId: c
      Cluster__Peers: a=http://node-a:5000,b=http://node-b:5000,c=http://node-c:5000
      Cluster__AllowTestControls: "true"
      Logging__LogLevel__Default: Warning
    depends_on:
      db-c:
        condition: service_healthy
    networks: [private]

  proxy-a:
    image: university-chainloot-frontend:latest
    pull_policy: never
    volumes:
      - ./infra/cluster-gateway/a.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [node-a]
    ports:
      - "127.0.0.1:${CLUSTER_PORT_A:-5101}:80"
    networks: [private, access]

  proxy-b:
    image: university-chainloot-frontend:latest
    pull_policy: never
    volumes:
      - ./infra/cluster-gateway/b.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [node-b]
    ports:
      - "127.0.0.1:${CLUSTER_PORT_B:-5102}:80"
    networks: [private, access]

  proxy-c:
    image: university-chainloot-frontend:latest
    pull_policy: never
    volumes:
      - ./infra/cluster-gateway/c.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [node-c]
    ports:
      - "127.0.0.1:${CLUSTER_PORT_C:-5103}:80"
    networks: [private, access]

  ui:
    image: university-chainloot-frontend:local-cluster
    pull_policy: never
    volumes:
      - ./frontend/docker/cluster-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [node-a, node-b, node-c]
    ports:
      - "127.0.0.1:${CLUSTER_UI_PORT:-5175}:80"
    networks: [private, access]

volumes:
  cluster-a-data:
  cluster-b-data:
  cluster-c-data:

networks:
  private:
    internal: true
  access: {}
