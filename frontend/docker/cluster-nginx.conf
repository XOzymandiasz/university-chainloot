server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location ~ ^/nodes/[abc]/cluster/internal/ {
        return 403;
    }

    location /nodes/a/ {
        set $node_a http://node-a:5000;
        rewrite ^/nodes/a/(.*)$ /$1 break;
        proxy_pass $node_a;
    }
    location /nodes/b/ {
        set $node_b http://node-b:5000;
        rewrite ^/nodes/b/(.*)$ /$1 break;
        proxy_pass $node_b;
    }
    location /nodes/c/ {
        set $node_c http://node-c:5000;
        rewrite ^/nodes/c/(.*)$ /$1 break;
        proxy_pass $node_c;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
